<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient: Deep Titanium Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181B22"/>
      <stop offset="50%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Subtle Radial Glow behind logo -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FF6B00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Edge Highlight for Monogram -->
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E8ECEF"/>
      <stop offset="75%" stop-color="#CAD0D8"/>
      <stop offset="100%" stop-color="#A5ACB5"/>
    </linearGradient>

    <!-- Vibrant Racing Orange Gradient -->
    <linearGradient id="racingOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8533"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <!-- Drop Shadow for Letters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Full-Bleed Base Background for Safe-Zone Android Cropping -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#ambientGlow)"/>

  <!-- Centered, Safe-Zone Scaled Content Group (0.8 scale, centered at 512, 512) -->
  <g transform="translate(102.4, 90) scale(0.8)">
    
    <!-- Inner Frame Accent -->
    <rect x="48" y="48" width="928" height="928" rx="180" fill="none" stroke="#252A36" stroke-width="4" stroke-opacity="0.6"/>
    
    <!-- Top Racing Bar -->
    <line x1="412" y1="96" x2="612" y2="96" stroke="#FF6B00" stroke-width="6" stroke-linecap="round"/>

    <!-- Central Graphic Group -->
    <g filter="url(#cardShadow)">
      
      <!-- Letter 'R' -->
      <path d="M 230 330 
               L 326 330 
               L 326 680 
               L 230 680 
               Z" fill="url(#metalSilver)"/>

      <path d="M 326 330 
               L 450 330 
               C 520 330 560 365 560 430 
               C 560 495 515 530 440 530 
               L 326 530 
               Z 
               M 326 415 
               L 428 415 
               C 458 415 474 420 474 430 
               C 474 442 458 448 428 448 
               L 326 448 
               Z" fill="url(#metalSilver)"/>

      <path d="M 405 515 
               L 535 680 
               L 425 680 
               L 332 548 
               L 380 515 
               Z" fill="url(#metalSilver)"/>

      <!-- Letter 'B' -->
      <path d="M 590 330 
               L 686 330 
               L 686 680 
               L 590 680 
               Z" fill="url(#metalSilver)"/>

      <path d="M 686 330 
               L 775 330 
               C 830 330 862 355 862 405 
               C 862 445 838 472 795 488 
               C 850 505 878 538 878 595 
               C 878 655 835 680 770 680 
               L 686 680 
               Z 
               M 686 405 
               L 758 405 
               C 778 405 790 412 790 422 
               C 790 435 778 440 758 440 
               L 686 440 
               Z 
               M 686 515 
               L 765 515 
               C 788 515 802 525 802 545 
               C 802 565 788 575 765 575 
               L 686 575 
               Z" fill="url(#metalSilver)"/>

      <!-- Signature Brand Dot "." in Pure Electric Racing Orange -->
      <circle cx="850" cy="654" r="32" fill="url(#racingOrange)"/>
      <circle cx="850" cy="654" r="42" fill="none" stroke="#FF6B00" stroke-width="3" stroke-opacity="0.4"/>

    </g>

    <!-- Bottom Brand Text -->
    <g>
      <rect x="362" y="760" width="300" height="42" rx="10" fill="#15181F" stroke="#252A36" stroke-width="2"/>
      <text x="512" y="787" 
            font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" 
            font-size="19" 
            font-weight="800" 
            letter-spacing="5" 
            fill="#FF6B00" 
            text-anchor="middle">
        SIEP RACING
      </text>
    </g>

  </g>

</svg>
